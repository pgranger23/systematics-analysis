[project]
name = "systematics"
version = "0.1.0"
description = "Tools to read and analyze neutrino cross-section systematic variations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "polars>=1.0.0",
    "awkward>=2.0.0",
    "uproot>=5.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",
    "pyyaml>=6.0.0",
    "particle>=0.23.0",
    "ipykernel>=6.0.0",
    "ipywidgets>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
